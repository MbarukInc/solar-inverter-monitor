# Battery voltage missing, read as an inverter polling failure.
#
# Grafana Cloud alert rule in Grafana's provisioning format. Like
# kplc-voltage.yaml it predates this directory, was built from the dashboard,
# and was live but untracked until 2026-10-26.
#
# Fires when the last bat_volts reading in a 6-hour window is below 20 V, with
# an unload evaluator at 21 V so it does not flap across the boundary.
# noDataState and execErrState are both Alerting, so absent data is itself the
# alert, and missingSeriesEvalsToResolve is 3.
#
# It notifies the tr-node8-solar-remediation webhook rather than email.
#
# It overlaps inverter-silent-while-bms-reports.yaml, which tests the same
# failure better: that rule uses the battery reader as a control, so it can
# tell "the inverter stopped" from "the host, the network or InfluxDB
# stopped". A bare voltage floor cannot, and it also cannot tell a dead link
# from a genuinely flat battery. Whether this rule should now be retired is an
# open question -- see ../README.md, "Alerts".
apiVersion: 1
groups:
  - orgId: 1
    name: '5m'
    folder: Power
    interval: 5m
    rules:
      - uid: dfmmrqxh77bb4e
        title: Inverter Data Polling Issues
        condition: C
        for: 15m
        noDataState: Alerting
        execErrState: Alerting
        missingSeriesEvalsToResolve: 3
        isPaused: false
        annotations:
          __dashboardUid__: RTundaRgz
          __panelId__: '2'
          summary: Batt Voltage levels missing. Possible inverter monitoring link
            failure
        notification_settings:
          receiver: tr-node8-solar-remediation
        data:
          - datasourceUid: fdwa5hfyf5o1sa
            model:
              adhocFilters: []
              alias: Battery Voltage
              datasource:
                type: influxdb
                uid: fdwa5hfyf5o1sa
              groupBy:
                - params:
                    - 1m
                  type: time
                - params:
                    - 'null'
                  type: fill
              instant: false
              intervalMs: 1000
              limit: ''
              maxDataPoints: 43200
              measurement: logs
              orderByTime: ASC
              policy: default
              query: ''
              range: true
              rawSql: ''
              refId: A
              resultFormat: time_series
              select:
                - - params:
                      - bat_volts
                    type: field
                  - params: []
                    type: last
              slimit: ''
              tz: ''
            refId: A
            relativeTimeRange:
              from: 21600
              to: 0
          - datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
            queryType: expression
            refId: B
            relativeTimeRange:
              from: 0
              to: 0
          - datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 20
                    type: lt
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    params: []
                    type: avg
                  type: query
                  unloadEvaluator:
                    params:
                      - 21
                    type: gt
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
            refId: C
            relativeTimeRange:
              from: 0
              to: 0

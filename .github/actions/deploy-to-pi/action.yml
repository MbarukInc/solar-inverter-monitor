name: Deploy to Raspberry Pi
description: >
  Sync the repo to the Pi, generate .env from repository secrets and variables,
  then rebuild and restart the monitor container.

inputs:
  pi_host:
    description: Hostname or IP of the Raspberry Pi (ssh as user "pi").
    required: true
  app_path:
    description: Absolute path to the checkout on the Pi.
    required: true
  db_host:
    description: InfluxDB host.
    required: true
  db_username:
    description: InfluxDB username.
    required: true
  db_password:
    description: InfluxDB password.
    required: true
  db_port:
    description: InfluxDB port. Falls back to the compose default when empty.
    required: false
  db_name:
    description: InfluxDB database. Falls back to the compose default when empty.
    required: false
  sample_interval:
    description: Seconds between samples. Compose default when empty.
    required: false
  log_level:
    description: INFO or DEBUG. Compose default when empty.
    required: false
  usb_device:
    description: Host path to the RS485 adapter. Compose default when empty.
    required: false

runs:
  using: composite
  steps:
    # Fail before touching the Pi rather than shipping a half-populated .env.
    # A failed `docker compose up` would leave the running container alone, but
    # a clear error here beats debugging interpolation output.
    - name: Check required secrets and variables are set
      shell: bash
      env:
        PI_HOST: ${{ inputs.pi_host }}
        APP_PATH: ${{ inputs.app_path }}
        DB_HOST: ${{ inputs.db_host }}
        DB_USERNAME: ${{ inputs.db_username }}
        DB_PASSWORD: ${{ inputs.db_password }}
      run: |
        missing=()
        for name in PI_HOST APP_PATH DB_HOST DB_USERNAME DB_PASSWORD; do
          if [ -z "${!name-}" ]; then missing+=("$name"); fi
        done
        if [ "${#missing[@]}" -gt 0 ]; then
          echo "::error::Not configured: ${missing[*]}."
          echo "::error::Set DB_HOST as a repository variable and DB_USERNAME/DB_PASSWORD as repository secrets."
          exit 1
        fi
        echo "All required configuration is present."

    # .env is excluded here and written in the next step instead, so a stale
    # copy in the checkout can never overwrite the generated one.
    - name: Copy code to Raspberry Pi
      shell: bash
      env:
        PI_HOST: ${{ inputs.pi_host }}
        APP_PATH: ${{ inputs.app_path }}
      run: |
        rsync -avz \
          --exclude '.git/' \
          --exclude '.github/' \
          --exclude '.env' \
          --exclude '.DS_Store' \
          ./ "pi@$PI_HOST:$APP_PATH/"

    # Piped over stdin rather than passed as arguments or scp'd: nothing lands
    # in the runner's temp dir and no value appears in the remote process list.
    # Only non-empty values are written, so docker-compose.yml's ${VAR:-default}
    # fallbacks still apply to anything left unset.
    - name: Write .env on the Raspberry Pi
      shell: bash
      env:
        PI_HOST: ${{ inputs.pi_host }}
        APP_PATH: ${{ inputs.app_path }}
        DB_HOST: ${{ inputs.db_host }}
        DB_PORT: ${{ inputs.db_port }}
        DB_NAME: ${{ inputs.db_name }}
        DB_USERNAME: ${{ inputs.db_username }}
        DB_PASSWORD: ${{ inputs.db_password }}
        SAMPLE_INTERVAL: ${{ inputs.sample_interval }}
        LOG_LEVEL: ${{ inputs.log_level }}
        USB_DEVICE: ${{ inputs.usb_device }}
      run: |
        {
          echo "# Generated by GitHub Actions -- do not edit by hand."
          echo "# Source: repository secrets and variables. Edit those, then re-run the workflow."
          for name in DB_HOST DB_PORT DB_NAME DB_USERNAME DB_PASSWORD \
                      SAMPLE_INTERVAL LOG_LEVEL USB_DEVICE; do
            value="${!name-}"
            # Compose interpolates .env values, so a password containing $ or
            # ${...} would be silently rewritten -- and since it arrives from a
            # masked secret, the corruption would never show up in the logs.
            # $$ is Compose's escape for a literal $.
            value="${value//\$/\$\$}"
            if [ -n "$value" ]; then printf '%s=%s\n' "$name" "$value"; fi
          done
        } | ssh "pi@$PI_HOST" "umask 077; cat > '$APP_PATH/.env'"

        # Confirm it landed and is not empty, without printing its contents.
        ssh "pi@$PI_HOST" "test -s '$APP_PATH/.env'"
        echo "Wrote $(ssh "pi@$PI_HOST" "grep -c '^[A-Z]' '$APP_PATH/.env'") settings to .env (mode 600)."

    # The container no longer bind-mounts the source, so a code change only
    # takes effect once the image is rebuilt.
    - name: Rebuild and restart monitor
      shell: bash
      env:
        PI_HOST: ${{ inputs.pi_host }}
        APP_PATH: ${{ inputs.app_path }}
      run: |
        ssh "pi@$PI_HOST" 'bash -s' -- "$APP_PATH" <<'REMOTE'
        set -euo pipefail
        cd "$1"
        if docker compose version >/dev/null 2>&1; then
          DC="docker compose"
        else
          DC="docker-compose"
        fi
        $DC up -d --build monitor
        $DC ps monitor
        REMOTE

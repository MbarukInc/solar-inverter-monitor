# `version:` is obsolete under Compose v2 and only produces a warning.
services:
  monitor:
    build:
      context: monitor
    restart: always
    # Not a `devices:` mapping. That binds one device node at container-create
    # time, so when the adapter de-enumerates during an inverter outage and the
    # kernel hands it back as ttyUSB1, the mapping points at a node that no
    # longer exists and every read fails with ENXIO until the container is
    # recreated. Observed in production overnight on 2026-08-24.
    #
    # Instead: make /dev visible and grant access to USB-serial character
    # devices only (major 188). Whatever node the adapter lands on, the
    # container can open it, and ups.resolve_device() finds it.
    volumes:
      - /dev:/dev
    device_cgroup_rules:
      - "c 188:* rmw"
    environment:
      # Was hardcoded to /dev/ttyUSB0, which was correct only while the
      # `devices:` mapping renamed the host node to that path inside the
      # container. Without that mapping the container sees the real host path,
      # so this has to come from configuration. Set USB_DEVICE to the
      # /dev/serial/by-id symlink: it survives the renumbering that broke this
      # on 2026-08-24, where the adapter came back as ttyUSB1.
      USB_DEVICE: "${USB_DEVICE:-/dev/ttyUSB0}"
      DB_HOST: "${DB_HOST:?set DB_HOST in .env}"
      DB_PORT: "${DB_PORT:-8086}"
      DB_USERNAME: "${DB_USERNAME:?set DB_USERNAME in .env}"
      DB_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD in .env}"
      DB_NAME: "${DB_NAME:-ups}"
      INVERTER_MODEL: "must-pv1800"
      MODBUS_SLAVE_ID: "${MODBUS_SLAVE_ID:-4}"
      MODBUS_BAUD_RATE: "${MODBUS_BAUD_RATE:-19200}"
      SAMPLE_INTERVAL: "${SAMPLE_INTERVAL:-30}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    # The daemon logs a line per sample. Without rotation that grows without
    # bound on the SD card.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
